spring.application.name=assignment
spring.datasource.url=jdbc:mysql://localhost:3306/ai_app
spring.datasource.username=root
spring.datasource.password=xxxx

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

file.upload-dir=uploads/

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB 

gemini.api-key=YOUR_API_KEY

# JWT secret - replace in production with a secure value
jwt.secret=ThisIsAChangeMeSecretKeyForDevOnlyReplaceWithSecureOne

# bind to all interfaces so the server is reachable from containers/remote dev environments
server.address=0.0.0.0